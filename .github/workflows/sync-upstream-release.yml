name: Sync upstream and create release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_KEY_ALIAS: diasync

concurrency:
  group: aaps-sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      before_version: ${{ steps.sync.outputs.before_version }}
      version: ${{ steps.sync.outputs.version }}
      sha: ${{ steps.sync.outputs.sha }}
      tag: ${{ steps.sync.outputs.tag }}
      sync_changed: ${{ steps.sync.outputs.sync_changed }}
      version_changed: ${{ steps.sync.outputs.version_changed }}
      should_release: ${{ steps.sync.outputs.should_release }}

    steps:
      - name: Check out fork master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream master
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          read_version() {
            sed -nE 's/^[[:space:]]*const val appVersion = "([^"]+)".*/\1/p' \
              buildSrc/src/main/kotlin/Versions.kt | head -n 1
          }

          before_sha=$(git rev-parse HEAD)
          before_version=$(read_version)
          if [[ -z "$before_version" ]]; then
            echo "Unable to determine the current AAPS version" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/nightscout/AndroidAPS.git
          git fetch --no-tags upstream master
          git merge --no-edit upstream/master

          after_sha=$(git rev-parse HEAD)
          version=$(read_version)
          if [[ -z "$version" ]]; then
            echo "Unable to determine the updated AAPS version" >&2
            exit 1
          fi

          release_tag="aaps-${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            should_release=false
          else
            should_release=true
          fi

          if [[ "$before_sha" == "$after_sha" ]]; then
            sync_changed=false
          else
            sync_changed=true
            git push origin HEAD:master
          fi

          if [[ "$before_version" == "$version" ]]; then
            version_changed=false
          else
            version_changed=true
          fi

          echo "before_version=$before_version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$after_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "sync_changed=$sync_changed" >> "$GITHUB_OUTPUT"
          echo "version_changed=$version_changed" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

      - name: Write sync summary
        shell: bash
        env:
          BEFORE_VERSION: ${{ steps.sync.outputs.before_version }}
          SHOULD_RELEASE: ${{ steps.sync.outputs.should_release }}
          SYNC_CHANGED: ${{ steps.sync.outputs.sync_changed }}
          VERSION: ${{ steps.sync.outputs.version }}
          VERSION_CHANGED: ${{ steps.sync.outputs.version_changed }}
        run: |
          {
            echo "## AAPS upstream sync"
            echo
            echo "- Version before sync: \`$BEFORE_VERSION\`"
            echo "- Version after sync: \`$VERSION\`"
            echo "- Repository updated: \`$SYNC_CHANGED\`"
            echo "- Version changed: \`$VERSION_CHANGED\`"
            echo "- Release required: \`$SHOULD_RELEASE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build unsigned production APKs
    needs: sync
    if: needs.sync.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read

    steps:
      - name: Check out synchronized source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.sync.outputs.sha }}

      - name: Determine Java version
        id: java
        shell: bash
        run: |
          set -euo pipefail
          java_version=$(sed -nE \
            's/^[[:space:]]*val javaVersion = JavaVersion.VERSION_([0-9]+).*/\1/p' \
            buildSrc/src/main/kotlin/Versions.kt | head -n 1)
          if [[ -z "$java_version" ]]; then
            echo "Unable to determine the Java version required by AAPS" >&2
            exit 1
          fi
          echo "version=$java_version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build unsigned APKs
        run: |
          ./gradlew :app:assembleFullRelease :wear:assembleFullRelease \
            -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseParallelGC -Xss1024m" \
            -Dkotlin.daemon.jvm.options="-Xmx2g" \
            -Dkotlin.compiler.execution.strategy="in-process" \
            -Dorg.gradle.workers.max=8 \
            -Dorg.gradle.caching=true

      - name: Collect unsigned APKs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          phone_apks=(app/build/outputs/apk/full/release/*.apk)
          wear_apks=(wear/build/outputs/apk/full/release/*.apk)
          if (( ${#phone_apks[@]} != 1 || ${#wear_apks[@]} != 1 )); then
            echo "Expected exactly one phone APK and one Wear APK" >&2
            exit 1
          fi

          mkdir unsigned-apks
          cp "${phone_apks[0]}" unsigned-apks/aaps-unsigned.apk
          cp "${wear_apks[0]}" unsigned-apks/aaps-wear-unsigned.apk

      - name: Upload unsigned APKs
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apks-${{ needs.sync.outputs.sha }}
          path: unsigned-apks/
          if-no-files-found: error
          retention-days: 1

  sign-and-release:
    name: Sign APKs and create release
    needs:
      - sync
      - build
    if: needs.sync.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download unsigned APKs
        uses: actions/download-artifact@v5
        with:
          name: unsigned-apks-${{ needs.sync.outputs.sha }}
          path: unsigned-apks

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo "All Android signing settings must be configured" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aaps-release.jks"

      - name: Sign and verify APKs
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ needs.sync.outputs.version }}
        run: |
          set -euo pipefail
          build_tools_version=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d \
            -exec basename {} \; | sort -V | tail -n 1)
          apksigner="$ANDROID_HOME/build-tools/$build_tools_version/apksigner"
          zipalign="$ANDROID_HOME/build-tools/$build_tools_version/zipalign"
          if [[ ! -x "$apksigner" || ! -x "$zipalign" ]]; then
            echo "Android signing tools were not found" >&2
            exit 1
          fi

          mkdir release-artifacts
          "$zipalign" -f -p 4 \
            unsigned-apks/aaps-unsigned.apk "$RUNNER_TEMP/aaps-aligned.apk"
          "$zipalign" -f -p 4 \
            unsigned-apks/aaps-wear-unsigned.apk "$RUNNER_TEMP/aaps-wear-aligned.apk"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/aaps-release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "release-artifacts/aaps-${RELEASE_VERSION}.apk" \
            "$RUNNER_TEMP/aaps-aligned.apk"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/aaps-release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "release-artifacts/aaps-wear-${RELEASE_VERSION}.apk" \
            "$RUNNER_TEMP/aaps-wear-aligned.apk"
          "$apksigner" verify --verbose --print-certs "release-artifacts/aaps-${RELEASE_VERSION}.apk"
          "$apksigner" verify --verbose --print-certs "release-artifacts/aaps-wear-${RELEASE_VERSION}.apk"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.sync.outputs.sha }}
          RELEASE_TAG: ${{ needs.sync.outputs.tag }}
          RELEASE_VERSION: ${{ needs.sync.outputs.version }}
        run: |
          set -euo pipefail
          release_args=(
            "$RELEASE_TAG"
            release-artifacts/*.apk
            --target "$RELEASE_SHA"
            --title "AAPS ${RELEASE_VERSION}"
            --generate-notes
          )
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
